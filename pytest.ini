[pytest]
# Runs all three packages' test suites together from the repo root. Each
# package is installed editable separately (see each package's own
# pyproject.toml); this file is just the shared dev/test-runner config,
# not a package itself.
#
# Deliberately NOT --import-mode=importlib: that mode walks up from each
# test file to its nearest pyproject.toml (nbcore/pyproject.toml etc.)
# and inserts that directory onto sys.path for local-editable-testing
# convenience - but since the directory is named identically to the
# real installed package (nbcore/ vs the nbcore package), it creates a
# namespace-package stub that shadows the real one for the rest of the
# session. Default "prepend" mode + no __init__.py in tests/ (bare
# basename imports) avoids that entirely.
testpaths = nbcore/tests nbfix/tests nbcompile/tests
