name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --editable "./nbcore[dev]" --editable "./nbharness[dev]" --editable "./nbfix[dev]" --editable "./nbcompile[dev]"

      - name: Run tests
        run: pytest
