[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "nbcore"
version = "0.1.0"
description = "Parser, CFG, dependency-graph, and analysis framework shared by NBFix and NBCompile"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "lark == 1.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
# LLM-assisted bug detection support (client/config transport plus the
# general, cell-dict-generic bug-detection feature) - kept fully optional
# so nothing that just needs the parser/CFG/analyses gains an import-time
# dependency on an LLM client.
llm = [
    "openai>=1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/nbcore"]
